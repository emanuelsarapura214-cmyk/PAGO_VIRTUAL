
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios | MiPagoVirtual</title>

    <link rel="icon" href="../imagen/logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body data-role="administrador">

    <main>

        <!-- ENCABEZADO DE LA PÁGINA -->
        <div class="page-heading">

            <div>
                <div class="eyebrow">GESTIÓN DE CUENTAS</div>

                <h1>Usuarios registrados</h1>

                <p>
                    Consultá los datos de las personas que usan el sistema.
                </p>
            </div>

        </div>


        <!-- LISTADO DE USUARIOS -->
        <section class="content-card">

            <h2>Usuarios registrados</h2>

            <p>
                Personas que enviaron una inscripción desde el panel de usuario.
            </p>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>DNI</th>
                            <th>Contacto</th>
                            <th>Actividad</th>
                            <th>Fecha de registro</th>
                        </tr>
                    </thead>

                    <tbody id="tablaUsuarios">

                        <tr>
                            <td colspan="5">
                                Todavía no hay usuarios registrados.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- ARCHIVO JAVASCRIPT -->
    <script src="../js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
