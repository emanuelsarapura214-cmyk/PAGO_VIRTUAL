
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estadísticas | MiPagoVirtual</title>

    <!-- Icono y estilos -->
    <link rel="icon" href="../imagen/logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body data-role="administrador">

    <main>

        <!-- Encabezado de la página -->
        <div class="page-heading">
            <div>
                <div class="eyebrow">INFORMES DEL CLUB</div>

                <h1>Estadísticas</h1>

                <p>
                    Resumen general de usuarios, inscripciones, pagos y asistencia.
                </p>
            </div>
        </div>

        <!-- Estadísticas generales -->
        <div class="stats-grid">

            <div class="stat-card">
                <small>Usuarios registrados</small>
                <strong id="statUsuarios">0</strong>
            </div>

            <div class="stat-card">
                <small>Inscripciones</small>
                <strong id="statInscripciones">0</strong>
            </div>

            <div class="stat-card">
                <small>Pagos</small>
                <strong id="statPagos">0</strong>
            </div>

            <div class="stat-card">
                <small>Asistencias</small>
                <strong id="statAsistencias">0</strong>
            </div>

        </div>

        <!-- Resumen de pagos -->
        <section class="content-card">

            <h2>Resumen de pagos</h2>

            <div class="table-wrap">
                <table>

                    <thead>
                        <tr>
                            <th>Estado</th>
                            <th>Cantidad</th>
                        </tr>
                    </thead>

                    <tbody id="tablaEstadisticasPagos">
                    </tbody>

                </table>
            </div>

        </section>

        <!-- Resumen de inscripciones -->
        <section class="content-card">

            <h2>Resumen de inscripciones</h2>

            <div class="table-wrap">
                <table>

                    <thead>
                        <tr>
                            <th>Estado</th>
                            <th>Cantidad</th>
                        </tr>
                    </thead>

                    <tbody id="tablaEstadisticasInscripciones">
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <!-- JavaScript principal -->
    <script src="../js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
