
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar pagos | MiPagoVirtual</title>

    <link rel="icon" href="../imagen/logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body data-role="administrador">

    <main>

        <!-- ENCABEZADO DE LA PÁGINA -->
        <div class="page-heading">

            <div>
                <div class="eyebrow">GESTIÓN ECONÓMICA</div>

                <h1>Pagos</h1>

                <p>
                    Consultá y actualizá el estado de las cuotas y pagos.
                </p>
            </div>

        </div>


        <!-- CONTROL DE PAGOS -->
        <section class="content-card">

            <h2>Control de pagos</h2>

            <p>
                El administrador puede actualizar el estado de los pagos
                registrados en la demostración.
            </p>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Jugador</th>
                            <th>Concepto</th>
                            <th>Importe</th>
                            <th>Medio</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="tablaPagosAdmin">

                        <tr>
                            <td colspan="7">
                                Todavía no hay pagos registrados.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- ARCHIVO JAVASCRIPT -->
    <script src="../js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
