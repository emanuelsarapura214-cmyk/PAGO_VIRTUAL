
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscripciones | MiPagoVirtual</title>

    <!-- Icono y estilos -->
    <link rel="icon" href="../imagen/logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body data-role="administrador">

    <main>

        <!-- Encabezado de la página -->
        <div class="page-heading">
            <div>
                <div class="eyebrow">GESTIÓN DE INSCRIPCIONES</div>

                <h1>Inscripciones</h1>

                <p>
                    Aceptá o rechazá las solicitudes enviadas por los usuarios.
                </p>
            </div>
        </div>

        <!-- Sección de solicitudes -->
        <section class="content-card">

            <h2>Solicitudes de inscripción</h2>

            <p>
                Revisá las solicitudes y actualizá su estado.
            </p>

            <!-- Tabla de inscripciones -->
            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Jugador</th>
                            <th>DNI</th>
                            <th>Actividad</th>
                            <th>Contacto</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="tablaInscripcionesAdmin">

                        <tr>
                            <td colspan="7">
                                Todavía no hay solicitudes.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- JavaScript principal -->
    <script src="../js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
