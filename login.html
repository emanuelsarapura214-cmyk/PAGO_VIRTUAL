
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | MiPagoVirtual</title>

    <!-- Icono -->
    <link rel="icon" href="imagen/logo.jpeg">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card" aria-labelledby="loginTitle">

            <!-- Logo -->
            <img
                src="imagen/logo.jpeg"
                class="login-logo"
                alt="Logo del club"
            >

            <!-- Título -->
            <h1 id="loginTitle">MiPagoVirtual</h1>

            <p>
                Club Deportivo · Gestión de cuotas, inscripciones y pagos
            </p>

            <!-- Mensajes -->
            <div
                id="loginMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <!-- Formulario de inicio de sesión -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="usuario">Correo electrónico</label>

                    <input
                        id="usuario"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="Ingresá tu correo"
                    >
                </div>

                <div class="form-group">
                    <label for="clave">Contraseña</label>

                    <input
                        id="clave"
                        type="password"
                        autocomplete="current-password"
                        minlength="8"
                        required
                        placeholder="Tu contraseña"
                    >
                </div>

                <!-- Botón ingresar -->
                <button
                    class="btn"
                    id="loginButton"
                    type="submit"
                >
                    Ingresar al sistema →
                </button>

            </form>

            <!-- Separador -->
            <div class="auth-divider">
                <span>¿Todavía no tenés cuenta?</span>
            </div>

            <!-- Crear cuenta -->
            <a
                class="btn auth-create-button"
                href="registro.html"
            >
                ＋ Crear cuenta
            </a>

            <!-- Información -->
            <p class="login-note">
                Ingresá con tu cuenta registrada.
                Los administradores y entrenadores reciben sus permisos
                desde la administración del club.
            </p>

        </section>

    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>

        // Configuración del tema
        document.body.classList.toggle(
            'light',
            localStorage.getItem('mipv_theme') === 'light'
        );

        // Elementos del formulario
        const form = document.getElementById('loginForm');
        const message = document.getElementById('loginMessage');
        const button = document.getElementById('loginButton');

        // Mostrar mensajes
        function showMessage(text, type = 'error') {
            message.textContent = text;
            message.className = 'auth-message ' + type;
            message.hidden = false;
        }

        // Iniciar sesión
        form.addEventListener('submit', async (event) => {

            event.preventDefault();

            // Obtener datos
            const email = document.getElementById('usuario')
                .value.trim().toLowerCase();

            const password = document.getElementById('clave').value;

            // Verificar conexión con Supabase
            if (!window.mipvSupabase) {
                showMessage(
                    'Primero configurá Supabase en js/supabase.js y ejecutá el SQL de configuración.'
                );
                return;
            }

            // Deshabilitar botón
            button.disabled = true;
            button.textContent = 'Ingresando...';

            try {

                // Autenticar usuario
                const { data, error } =
                    await window.mipvSupabase.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {
                    throw error;
                }

                // Obtener perfil del usuario
                const {
                    data: profile,
                    error: profileError
                } = await window.mipvSupabase
                    .from('usuarios')
                    .select(
                        'id_usuario,nombre_usuario,rol_usuario,estado_usuario'
                    )
                    .eq('auth_uid', data.user.id)
                    .single();

                // Verificar perfil
                if (
                    profileError ||
                    !profile ||
                    !profile.estado_usuario
                ) {
                    await window.mipvSupabase.auth.signOut();

                    throw new Error(
                        'Tu cuenta todavía no tiene un perfil activo. Contactá al club.'
                    );
                }

                // Verificar rol
                const role = profile.rol_usuario;

                if (
                    !['usuario', 'entrenador', 'administrador'].includes(role)
                ) {
                    await window.mipvSupabase.auth.signOut();

                    throw new Error(
                        'El rol de tu cuenta no es válido.'
                    );
                }

                // Guardar datos de sesión
                sessionStorage.setItem('mipv_role', role);

                sessionStorage.setItem(
                    'mipv_name',
                    profile.nombre_usuario
                );

                // Redireccionar según el rol
                const destinations = {
                    usuario: 'usuario/index.html',
                    entrenador: 'entrenador/index.html',
                    administrador: 'administrador/index.html'
                };

                location.href = destinations[role];

            } catch (error) {

                // Mostrar error
               showMessage('Correo electrónico o contraseña incorrectos.');

            } finally {

                // Restaurar botón
                button.disabled = false;
                button.textContent = 'Ingresar al sistema →';

            }

        });

    </script>

</body>
</html>
