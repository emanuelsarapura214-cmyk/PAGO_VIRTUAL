
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | MiPagoVirtual</title>

    <!-- Icono -->
    <link rel="icon" href="imagen/logo.jpeg">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card" aria-labelledby="registerTitle">

            <!-- Logo -->
            <img
                src="imagen/logo.jpeg"
                class="login-logo"
                alt="Logo del club"
            >

            <!-- Título -->
            <h1 id="registerTitle">Crear cuenta</h1>

            <p>
                Registrate para formar parte del club y gestionar tus actividades.
            </p>

            <!-- Mensajes -->
            <div
                id="registerMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <!-- Formulario -->
            <form id="registroForm">

                <div class="form-group">
                    <label for="nombre">Nombre y apellido</label>
                    <input
                        id="nombre"
                        type="text"
                        autocomplete="name"
                        maxlength="100"
                        required
                        placeholder="Ej. Juan Pérez"
                    >
                </div>

                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input
                        id="dni"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]{7,8}"
                        minlength="7"
                        maxlength="8"
                        required
                        placeholder="Sin puntos"
                    >
                    <small class="auth-hint">
                        Ingresá entre 7 y 8 números.
                    </small>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        maxlength="100"
                        required
                        placeholder="nombre@correo.com"
                    >
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input
                        id="telefono"
                        type="tel"
                        autocomplete="tel"
                        maxlength="30"
                        required
                        placeholder="Código de área y número"
                    >
                </div>

                <div class="form-group">
                    <label for="clave">Contraseña</label>
                    <input
                        id="clave"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        placeholder="Mínimo 8 caracteres"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmarClave">Confirmar contraseña</label>
                    <input
                        id="confirmarClave"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        placeholder="Repetí tu contraseña"
                    >
                </div>

                <!-- Botón de registro -->
                <button
                    class="btn"
                    id="registerButton"
                    type="submit"
                >
                    Crear mi cuenta
                </button>

            </form>

            <!-- Información sobre los roles -->
            <p class="login-note">
                Las cuentas nuevas se crean como usuario.
                Los roles de entrenador y administrador son asignados por el club.
            </p>

            <!-- Volver al login -->
            <p class="auth-back">
                <a href="login.html">
                    ← Ya tengo una cuenta. Iniciar sesión
                </a>
            </p>

        </section>

    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        // Configuración del tema
        document.body.classList.toggle(
            'light',
            localStorage.getItem('mipv_theme') === 'light'
        );

        // Elementos del formulario
        const form = document.getElementById('registroForm');
        const message = document.getElementById('registerMessage');
        const button = document.getElementById('registerButton');

        // Mostrar mensajes
        function showMessage(text, type = 'error') {
            message.textContent = text;
            message.className = 'auth-message ' + type;
            message.hidden = false;
        }

        // Enviar formulario
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            // Obtener datos
            const fullName = document.getElementById('nombre')
                .value.trim().replace(/\s+/g, ' ');

            const dni = document.getElementById('dni').value.trim();

            const email = document.getElementById('email')
                .value.trim().toLowerCase();

            const phone = document.getElementById('telefono')
                .value.trim();

            const password = document.getElementById('clave').value;

            const confirmation = document.getElementById('confirmarClave')
                .value;

            // Validar nombre
            if (fullName.split(' ').length < 2) {
                showMessage('Ingresá tu nombre y apellido.');
                return;
            }

            // Validar DNI
            if (!/^[0-9]{7,8}$/.test(dni)) {
                showMessage('El DNI debe tener 7 u 8 números.');
                return;
            }

            // Validar contraseña
            if (password.length < 8) {
                showMessage('La contraseña debe tener al menos 8 caracteres.');
                return;
            }

            // Confirmar contraseña
            if (password !== confirmation) {
                showMessage('Las contraseñas no coinciden.');
                return;
            }

            // Verificar Supabase
            if (!window.mipvSupabase) {
                showMessage(
                    'Primero configurá Supabase en js/supabase.js y ejecutá database/registro_auth.sql.'
                );
                return;
            }

            // Separar nombre y apellido
            const parts = fullName.split(' ');
            const firstName = parts.shift();
            const lastName = parts.join(' ');

            // Deshabilitar botón
            button.disabled = true;
            button.textContent = 'Creando cuenta...';

            try {

                // Registrar usuario en Supabase
                const { data, error } =
                    await window.mipvSupabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                nombre_usuario: firstName,
                                apellido_usuario: lastName,
                                dni_usuario: dni,
                                telefono_usuario: phone
                            }
                        }
                    });

                if (error) {
                    throw error;
                }

                // Confirmación del registro
                if (data.session) {
                    showMessage(
                        '¡Tu cuenta fue creada! Ya podés iniciar sesión.',
                        'success'
                    );
                } else {
                    showMessage(
                        '¡Registro recibido! Revisá tu correo para confirmar la cuenta y después iniciá sesión.',
                        'success'
                    );
                }

                form.reset();

            } catch (error) {

                const raw = (error.message || '').toLowerCase();

                if (
                    raw.includes('duplicate') ||
                    raw.includes('already registered')
                ) {
                    showMessage(
                        'Ese correo o DNI ya está registrado. Revisá los datos o iniciá sesión.'
                    );
                } else {
                    showMessage(
                        error.message || 'No se pudo crear la cuenta.'
                    );
                }

            } finally {

                // Restaurar botón
                button.disabled = false;
                button.textContent = 'Crear mi cuenta';

            }
        });
    </script>

</body>
</html>
