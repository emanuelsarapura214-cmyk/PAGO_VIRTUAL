
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actividades del entrenador | MiPagoVirtual</title>

    <link rel="icon" href="../imagen/logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body data-role="entrenador">

    <main>

        <!-- ENCABEZADO DE LA PÁGINA -->
        <div class="page-heading">

            <div>
                <div class="eyebrow">GRUPOS DEPORTIVOS</div>

                <h1>Mis actividades</h1>

                <p>
                    Consultá las actividades y los grupos a tu cargo.
                </p>
            </div>

        </div>


        <!-- ACTIVIDADES ASIGNADAS -->
        <section class="content-card">

            <h2>Actividades asignadas</h2>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Actividad</th>
                            <th>Categoría</th>
                            <th>Días</th>
                            <th>Horario</th>
                            <th>Lugar</th>
                        </tr>
                    </thead>

                    <tbody id="tablaActividadesEntrenador">

                        <tr>
                            <td>Fútbol Infantil</td>
                            <td>Infantil</td>
                            <td>Lunes y miércoles</td>
                            <td>17:00 a 18:30</td>
                            <td>Cancha principal</td>
                        </tr>

                        <tr>
                            <td>Fútbol Juvenil</td>
                            <td>Juvenil</td>
                            <td>Martes y jueves</td>
                            <td>18:30 a 20:00</td>
                            <td>Cancha principal</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- ARCHIVO JAVASCRIPT -->
    <script src="../js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</html>
